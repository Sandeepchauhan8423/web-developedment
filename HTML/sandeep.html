<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrom Board Game</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #222;
    font-family: Arial, sans-serif;
    text-align: center;
    color: white;
}

h1 {
    margin: 15px;
}

#game {
    width: 600px;
    max-width: 95vw;
    margin: auto;
}

#board {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
    background: #f0edea;
    border: 25px solid #a6500e;
    box-shadow: 0 0 20px black;
    overflow: hidden;
}

.pocket {
    position: absolute;
    width: 55px;
    height: 55px;
    background: #111;
    border-radius: 50%;
}

.p1 { top: -5px; left: -5px; }
.p2 { top: -5px; right: -5px; }
.p3 { bottom: -5px; left: -5px; }
.p4 { bottom: -5px; right: -5px; }

.coin {
    position: absolute;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    border: 2px solid #333;
}

.black {
    background: #111;
}

.white {
    background: #db1414;
}

.red {
    background: red;
}

#striker {
    position: absolute;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: white;
    border: 3px solid #333;
    bottom: 45px;
    left: 50%;
    transform: translateX(-50%);
}

#controls {
    margin-top: 15px;
}

button {
    padding: 12px 25px;
    border: none;
    border-radius: 8px;
    background: #ff9800;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #e68900;
}

#score {
    margin: 15px;
    font-size: 20px;
}
</style>
</head>

<body>

<h1>🏆 Carrom Board</h1>

<div id="game">

    <div id="score">
        Score: <span id="points">0</span>
    </div>

    <div id="board">

        <div class="pocket p1"></div>
        <div class="pocket p2"></div>
        <div class="pocket p3"></div>
        <div class="pocket p4"></div>

        <!-- Coins -->
        <div class="coin red" style="left:50%;top:50%;"></div>

        <div class="coin black" style="left:45%;top:50%;"></div>
        <div class="coin black" style="left:55%;top:50%;"></div>
        <div class="coin black" style="left:50%;top:45%;"></div>
        <div class="coin black" style="left:50%;top:55%;"></div>

        <div class="coin white" style="left:47%;top:47%;"></div>
        <div class="coin white" style="left:53%;top:47%;"></div>
        <div class="coin white" style="left:47%;top:53%;"></div>
        <div class="coin white" style="left:53%;top:53%;"></div>

        <div id="striker"></div>

    </div>

    <div id="controls">
        <button onclick="shoot()">Shoot 🎯</button>
        <button onclick="resetGame()">Reset</button>
    </div>

</div>

<script>

let score = 0;

function shoot() {

    let coins = document.querySelectorAll(".coin");

    if (coins.length > 0) {

        let random =
            Math.floor(Math.random() * coins.length);

        let coin = coins[random];

        coin.style.left =
            Math.random() * 80 + 10 + "%";

        coin.style.top =
            Math.random() * 80 + 10 + "%";

        score += 10;

        document.getElementById("points").innerText = score;
    }
}

function resetGame() {

    location.reload();

}

</script>

</body>
</html>
