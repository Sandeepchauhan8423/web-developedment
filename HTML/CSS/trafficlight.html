<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .traffic-light{
            padding: 15px;
            border-radius: 15px;
            background: rgb(42, 41, 41);
           display: flex; 
            justify-content: space-between;
            width: 105px;


            
        }

        .light{
            border-radius: 50%;
            margin: 10px ;
            width: 80px;
            height: 80px;
        }

        .red{
         background: red;
        }

        .yellow{
        background: rgb(243, 243, 65);
        }

        .green{
         background:green ;
         }
    </style>
</head>
<body>
    <H4>TRAFFIC LIGHT</H4>
    <div class="traffic-light">
        <div class="light red"></div>
        <div class="light yellow"></div>
        <div class="light green"></div>
    </div> 
</body> 
</html>
